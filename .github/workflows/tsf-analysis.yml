name: TSF Analysis
on:
  push:
    branches: [ main, develop, test-TSF ]
  pull_request:
    branches: [ main ]

jobs:
  trustable-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # pega todo o historico de commits 

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # tem que ser a partir do .10 para o python

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Clone Trustable
      run: |
        git clone https://gitlab.com/CodethinkLabs/trustable/trustable.git
        cd trustable
        poetry install
    - name: Build and install Trustable package
      working-directory: trustable
      run: |
        poetry build
        poetry run pip install dist/trustable-2025.9.16.tar.gz
    - name: Run Trustable Analysis
      working-directory: trustable
      run: |
        poetry run python -m trudag.manage run \
          --config ../trustable-config/pipelines/github-pipeline.yaml

    - name: Diagnostic check (debug Trustable results)
      run: |
        echo "===== Diagnostic: checking result folder ====="
        ls -la trustable-config || echo "trustable-config not found"
        ls -la trustable-config/results || echo "results folder missing"
        
        echo "===== Searching for HTML or text files ====="
        find trustable-config -type f \( -name "*.html" -o -name "*.txt" -o -name "*.json" \) -print
        
        echo "===== Creating fake report if none exists ====="
        if [ ! -f trustable-config/results/relatorio.html ]; then
          mkdir -p trustable-config/results
          echo "<html><body><h1>Trustable test report</h1><p>No report generated by Trustable.</p></body></html>" > trustable-config/results/test_report.html
        fi
        
        echo "===== Files in results folder after diagnostic ====="
        ls -la trustable-config/results
        
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: trustable-report
        path: |
          trustable-config/results/
