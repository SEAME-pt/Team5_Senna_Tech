site_name: Senna Tech - Traceability Report
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - macros

extra_css:
  - custom_fixes.css

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.magiclink

docs_dir: .

nav:
  - Home: index.md
  - Expectations: EXP.md
  - Dashboard: dashboard.md
  - Graph Navigation: nav.md
  - Assumptions: ASM.md
  - Assertions: AST.md
  - Evidence:
    - Overview: EVD.md
    - Matrix: EVD-ASM.md
    - Detailed:
      - 'EVD-201': EVD-201.md
      - 'EVD-202': EVD-202.md
      - 'EVD-206': EVD-206.md
  - Full Report: trustable_report_for_Software.md
