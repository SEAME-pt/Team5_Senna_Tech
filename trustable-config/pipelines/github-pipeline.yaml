name: "TSF Pipeline"
description: "Automatic analysis in GitHub Actions"

# Uses the current repository code
local_repository: "."

steps:
  - name: "structure_analysis"
    type: "structure_analysis"
    config:
      languages: ["python", "javascript", "java"]

  - name: "security_scan"
    type: "security_scan"

  - name: "generate_report"
    type: "report"
    depends_on: ["structure_analysis", "security_scan"]
    output:
      type: html
      dir: ../trustable-config/results
